version: '3.8'

services:
  mongodb:
    image: mongo:4.2
    volumes:
      - mongo_data:/data/db
    networks:
      - graylog_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    environment:
      - discovery.type=single-node
      - cluster.name=graylog
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - graylog_net

  graylog1:
    image: graylog/graylog:3.3
    environment:
      - GRAYLOG_PASSWORD_SECRET=somepasswordpepper
      - GRAYLOG_ROOT_PASSWORD_SHA2=yourhashedpassword
      - GRAYLOG_HTTP_EXTERNAL_URI=http://graylog1:9000/
      - GRAYLOG_MONGODB_URI=mongodb://mongodb/graylog
      - GRAYLOG_ELASTICSEARCH_URI=http://elasticsearch:9200
    depends_on:
      - mongodb
      - elasticsearch
    networks:
      - graylog_net
    ports:
      - "9000:9000"  # Web interface

  graylog2:
    image: graylog/graylog:3.3
    environment:
      - GRAYLOG_PASSWORD_SECRET=somepasswordpepper
      - GRAYLOG_ROOT_PASSWORD_SHA2=yourhashedpassword
      - GRAYLOG_HTTP_EXTERNAL_URI=http://graylog2:9000/
      - GRAYLOG_MONGODB_URI=mongodb://mongodb/graylog
      - GRAYLOG_ELASTICSEARCH_URI=http://elasticsearch:9200
    depends_on:
      - mongodb
      - elasticsearch
    networks:
      - graylog_net

  graylog3:
    image: graylog/graylog:3.3
    environment:
      - GRAYLOG_PASSWORD_SECRET=somepasswordpepper
      - GRAYLOG_ROOT_PASSWORD_SHA2=yourhashedpassword
      - GRAYLOG_HTTP_EXTERNAL_URI=http://graylog3:9000/
      - GRAYLOG_MONGODB_URI=mongodb://mongodb/graylog
      - GRAYLOG_ELASTICSEARCH_URI=http://elasticsearch:9200
    depends_on:
      - mongodb
      - elasticsearch
    networks:
      - graylog_net

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "1514:1514"
    networks:
      - graylog_net

networks:
  graylog_net:

volumes:
  mongo_data:
  es_data:
